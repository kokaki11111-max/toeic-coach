<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Coach · 800分教练</title>
<style>
:root{
  --green:#1e7a3c; --green-dark:#155c2c; --green-light:#e8f3ec; --green-mid:#cfe6d8;
  --ink:#1a2b20; --gray:#6b7a70; --line:#e3ece6; --bg:#f7faf8; --card:#ffffff;
  --amber:#b45309; --amber-bg:#fef3e2; --red:#b91c1c; --red-bg:#fdeaea; --blue:#1d4ed8;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.app{max-width:1080px;margin:0 auto;padding:16px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px;}
header.top h1{font-size:22px;letter-spacing:.2px;}
header.top .sub{font-size:12px;color:var(--gray);}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;}
nav.tabs button.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;}
nav.tabs button:hover:not(.active){border-color:var(--green);color:var(--green);}
.view{display:none;}
.view.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.card h2{font-size:16px;margin-bottom:10px;}
.card h3{font-size:14px;margin-bottom:8px;}
.hero{background:var(--green-light);border-color:var(--green-mid);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.hero .label{color:var(--green);font-weight:700;font-size:12px;letter-spacing:1px;}
.hero .focus{font-size:20px;font-weight:700;margin-top:4px;}
.ring{position:relative;width:110px;height:110px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .txt b{font-size:22px;color:var(--green-dark);}
.ring .txt span{font-size:11px;color:var(--gray);}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}
.tasklist .task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff;cursor:pointer;transition:.15s;}
.tasklist .task:hover{border-color:var(--green);}
.tasklist .task.done{background:var(--green-light);border-color:var(--green-mid);}
.tasklist .task.done .tname{text-decoration:line-through;color:var(--gray);}
.tasklist .icon{width:38px;height:38px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.tasklist .tname{flex:1;font-weight:600;font-size:14px;}
.tasklist .tmin{color:var(--green);font-weight:700;font-size:13px;}
.tasklist .swap{border:none;background:none;color:var(--gray);cursor:pointer;font-size:12px;padding:4px;}
.scores{display:flex;justify-content:space-around;text-align:center;}
.scores .num{font-size:36px;font-weight:800;color:var(--green);}
.scores .cap{font-size:12px;color:var(--gray);}
.divider{width:1px;background:var(--line);}
.callout{display:flex;gap:12px;background:var(--green-light);border-left:4px solid var(--green);border-radius:10px;padding:14px;font-size:14px;}
.callout.warn{background:var(--amber-bg);border-left-color:var(--amber);}
.callout.danger{background:var(--red-bg);border-left-color:var(--red);}
.btn{display:inline-block;border:none;background:var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.btn:hover{background:var(--green-dark);}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green);}
.btn.small{padding:6px 12px;font-size:13px;}
.btn.gray{background:#eef2ef;color:var(--ink);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.pill.g{background:var(--green-light);color:var(--green-dark);}
.pill.a{background:var(--amber-bg);color:var(--amber);}
.pill.r{background:var(--red-bg);color:var(--red);}
.pill.b{background:#e7edfb;color:var(--blue);}
.vocab-card{max-width:560px;margin:0 auto;text-align:center;padding:30px 20px;}
.vocab-card .phrase{font-size:28px;font-weight:800;color:var(--green-dark);margin-bottom:6px;}
.vocab-card .word{font-size:13px;color:var(--gray);}
.vocab-card .cn{font-size:18px;margin:14px 0 6px;}
.vocab-card .ex{font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px;margin-top:12px;text-align:left;}
.vocab-card .ex .t{color:var(--gray);font-size:13px;}
.hidden{display:none!important;}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--green);}
.opt.correct{background:var(--green-light);border-color:var(--green);font-weight:600;}
.opt.wrong{background:var(--red-bg);border-color:var(--red);}
.passage{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;margin-bottom:12px;max-height:340px;overflow:auto;}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
input:focus,select:focus{outline:2px solid var(--green-mid);}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.formrow label{font-size:13px;color:var(--gray);}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
table.tbl th{color:var(--gray);font-weight:600;font-size:12px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;}
.bar-row .bl{width:110px;flex:none;color:var(--gray);}
.bar-row .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
.bar-row .fill{height:100%;background:var(--green);border-radius:4px;}
.bar-row .val{width:48px;text-align:right;font-weight:600;}
canvas.chart{width:100%;height:200px;}
.muted{color:var(--gray);font-size:13px;}
.stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;}
.chip b{display:block;font-size:20px;color:var(--green-dark);}
.chip span{font-size:11px;color:var(--gray);}
.conf-btns{display:flex;gap:8px;margin-top:10px;}
.timerbox{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green-dark);}
.book-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.book-tabs button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
.book-tabs button.active{background:var(--green);color:#fff;border-color:var(--green);}
.book-tabs button:disabled{opacity:.5;cursor:not-allowed;}
.footer-note{text-align:center;color:var(--gray);font-size:12px;padding:20px 0;}
dialog{border:none;border-radius:14px;padding:22px;max-width:420px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
dialog::backdrop{background:rgba(20,40,28,.35);}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mm-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;text-align:center;background:#fff;transition:.15s;}
.mm-item.sel{border-color:var(--green);background:var(--green-light);font-weight:600;}
.mm-item.done{opacity:.35;pointer-events:none;background:var(--green-light);border-color:var(--green-mid);}
.mm-item.err{border-color:var(--red);background:var(--red-bg);}
.seq-out,.seq-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px;}
.seq-out{border-style:solid;background:var(--bg);}
.seq-w{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:#fff;font-size:15px;transition:.12s;}
.seq-w:hover{border-color:var(--green);}
.seq-w.used{opacity:.2;pointer-events:none;}
.seq-w.err{border-color:var(--red);background:var(--red-bg);}
.seq-w.fixed{cursor:default;background:var(--green-light);border-color:var(--green-mid);}
ruby{ruby-position:over;ruby-align:center;margin:0 2px;}
rt{font-size:10px;color:#9aa8a0;font-weight:400;letter-spacing:0;}
ruby.rst{font-weight:600;}
ruby.rst rt{color:#1e7a3c;font-weight:600;}
ruby.rwk{color:#6b7a70;font-weight:400;}
.withipa{line-height:2.7;}
.vocab-card .phrase.withipa{line-height:2.2;}
@media(max-width:600px){
  .app{padding:10px;}
  .scores .num{font-size:28px;}
  .hero .focus{font-size:17px;}
  nav.tabs{position:sticky;top:0;background:var(--bg);z-index:10;padding:8px 0;}
  nav.tabs button{padding:7px 11px;font-size:13px;}
}
</style>
</head>

<div class="app">
<header class="top">
  <div><h1>TOEIC Coach</h1><div class="sub">目标 800 · 听力 420 / 阅读 380</div></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="syncStatus" class="muted" style="font-size:11px"></span>

  </div>

  <button data-v="home" class="active">首页</button>

  <div style="display:flex;flex-direction:column;gap:8px">
    <input type="text" id="syDb" placeholder="数据库地址 https://xxx.firebasedatabase.app">

  </div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
    <button class="btn" id="sySave">保存并同步</button>
    <button class="btn gray" id="syExport">导出备份</button>
    <button class="btn gray" id="syClose">关闭</button>
  </div>
  <div id="syMsg" class="muted" style="margin-top:8px"></div>
</dialog>

{id:"p5-3",q:"The new software is fully ______ with all existing operating systems.",o:["compatible","comparable","competitive","comprehensive"],a:0,tag:"词汇",exp:"compatible with 与……兼容。形近词辨析：comparable 可比较的，competitive 有竞争力的。"},
{id:"p5-4",q:"______ the heavy rain, the outdoor concert proceeded as scheduled.",o:["Despite","Although","However","Because of"],a:0,tag:"语法",exp:"空格后是名词短语 the heavy rain，需要介词。Although 接从句，However 是副词。"},
{id:"p5-5",q:"Ms. Chen reviewed the proposal ______ before sending it to the board.",o:["carefully","careful","care","caring"],a:0,tag:"语法",exp:"修饰动词 reviewed 需要副词 carefully。"},
{id:"p5-6",q:"The hotel offers a ______ shuttle service to the airport for all guests.",o:["complimentary","complementary","complimenting","complied"],a:0,tag:"词汇",exp:"complimentary 免费赠送的。complementary 是'互补的'，注意拼写区别。"},
{id:"p5-7",q:"Employees ______ have completed the training program are eligible for promotion.",o:["who","which","whose","whom"],a:0,tag:"语法",exp:"先行词是人 Employees 且在从句中作主语，用 who。"},
{id:"p5-8",q:"The quarterly report indicates a ______ increase in overseas sales.",o:["significant","significantly","signify","significance"],a:0,tag:"语法",exp:"修饰名词 increase 需要形容词 significant。"},
{id:"p5-9",q:"Please ______ from using mobile phones during the performance.",o:["refrain","prevent","avoid","prohibit"],a:0,tag:"词汇",exp:"refrain from doing 克制不做某事。avoid 直接接 doing，prohibit 是禁止他人。"},
{id:"p5-10",q:"The contract must be signed by ______ parties before work can begin.",o:["both","either","every","each other"],a:0,tag:"语法",exp:"parties 是复数，both parties 双方。either/every 接单数。"},
{id:"p5-11",q:"Ticket holders are ______ to a complimentary beverage at the reception.",o:["entitled","deserved","granted","awarded"],a:0,tag:"词汇",exp:"be entitled to 有权享有。固定搭配。"},
{id:"p5-12",q:"The factory has been operating at full ______ since the new orders arrived.",o:["capacity","capability","capacity's","capacious"],a:0,tag:"词汇",exp:"at full capacity 满负荷运转，固定搭配。"},
{id:"p5-13",q:"______ completing the online form, you will receive a confirmation email.",o:["Upon","During","While","Since"],a:0,tag:"语法",exp:"Upon doing = 一……就……。While 接从句或分词但语义不合。"},
{id:"p5-14",q:"The seminar was ______ attended, with over 300 participants.",o:["well","good","much","very"],a:0,tag:"词汇",exp:"well attended 出席人数多，固定搭配。"},
{id:"p5-15",q:"Neither the manager ______ the assistant was available to answer the call.",o:["nor","or","and","but"],a:0,tag:"语法",exp:"neither...nor... 固定搭配。"},
{id:"p5-16",q:"The company's profits have risen ______ over the past three years.",o:["steadily","steady","steadiness","steadier"],a:0,tag:"语法",exp:"修饰动词 have risen 需要副词 steadily。"},
{id:"p5-17",q:"Applications received after the deadline will not be ______.",o:["considered","considering","considerable","considerate"],a:0,tag:"语法",exp:"被动语态 will not be + 过去分词。considerable 相当大的，considerate 体贴的。"},
{id:"p5-18",q:"The museum is offering free ______ to all visitors this weekend.",o:["admission","permission","emission","commission"],a:0,tag:"词汇",exp:"admission 入场（费）。permission 许可，commission 佣金。"},
{id:"p5-19",q:"______ of the two candidates has the required certification.",o:["Neither","Both","All","Most"],a:0,tag:"语法",exp:"谓语 has 是单数，Neither of 接复数名词但谓语用单数。"},
{id:"p5-20",q:"The shipment was delayed ______ a problem at the customs office.",o:["owing to","because","since","as"],a:0,tag:"语法",exp:"空格后是名词短语，需要复合介词 owing to。其余均接从句。"},
{id:"p5-21",q:"Mr. Park will assume the role of director ______ Ms. Lopez retires next month.",o:["when","during","despite","among"],a:0,tag:"语法",exp:"空格后是完整从句，需要连词 when。"},
{id:"p5-22",q:"The R&D division was given ______ funding to develop the prototype.",o:["adequate","adequately","adequacy","more adequately"],a:0,tag:"语法",exp:"修饰名词 funding 需要形容词 adequate。"},
{id:"p5-23",q:"Reservations can be made ______ by phone or through our website.",o:["either","neither","both","also"],a:0,tag:"语法",exp:"either A or B 结构，与后文 or 呼应。"},
{id:"p5-24",q:"The keynote address will be delivered by a ______ economist from Seoul National University.",o:["renowned","renown","renownedly","renowning"],a:0,tag:"语法",exp:"修饰名词 economist 需要形容词 renowned 著名的。"},
{id:"p5-25",q:"Sales representatives must respond to customer inquiries ______.",o:["promptly","prompt","prompting","prompted"],a:0,tag:"语法",exp:"修饰动词 respond 需要副词 promptly 迅速地。"},
{id:"p5-26",q:"The lease agreement ______ that tenants must give 60 days' notice before moving out.",o:["stipulates","complies","adheres","consists"],a:0,tag:"词汇",exp:"stipulate 规定。comply with / adhere to / consist of 均需介词。"},
{id:"p5-27",q:"______ joining our company, Ms. Rivera worked at an accounting firm for ten years.",o:["Prior to","In order to","So as to","According"],a:0,tag:"词汇",exp:"Prior to + 动名词/名词 = 在……之前。"},
{id:"p5-28",q:"Attendance at the safety workshop is ______ for all warehouse personnel.",o:["mandatory","voluntary","tentative","redundant"],a:0,tag:"词汇",exp:"mandatory 强制性的，与 required 同义。语境为仓库人员必须参加。"}
];

{id:"p7-2",type:"邮件往来",passage:"[E-mail 1]\nFrom: Daniel Reed <dreed@brightpath.com>\nTo: Hana Sato <hsato@brightpath.com>\nSubject: Venue for client workshop\nDate: March 2\n\nHi Hana,\n\nThe Grandview Hotel just informed me that their conference room is double-booked on March 18, so we need a new venue for the client workshop. Attendance is confirmed at 45 people. We need a projector, microphones, and space for catering. Our budget is $1,200 for the day. Could you look into options and get back to me by Friday?\n\nDaniel\n\n[E-mail 2]\nFrom: Hana Sato <hsato@brightpath.com>\nTo: Daniel Reed <dreed@brightpath.com>\nSubject: RE: Venue for client workshop\nDate: March 4\n\nHi Daniel,\n\nI found three options. The Civic Center charges $900 but has no catering space. The Park Plaza meets all our needs at $1,150. The Innovation Hub is only $800 and has everything we need, but it can hold at most 40 people.\n\nGiven our headcount, I recommend booking the Park Plaza. If you agree, I will reserve it today and arrange a site visit next week.\n\nHana",

{q:"How much will the recommended venue cost?",o:["$1,150","$900","$800","$1,200"],a:0,tag:"定位",exp:"推荐的是 Park Plaza，费用 $1,150。"},

{id:"p7-3",type:"文章",passage:"Local Bakery Rises to National Fame\n\nWhat began as a weekend farmers' market stall has become one of the fastest-growing food businesses in the region. Flour & Stone Bakery, founded five years ago by former accountant Mia Torres, now operates four locations and employs over sixty people.\n\nTorres attributes the bakery's success to its focus on locally sourced ingredients. \"Every grain we use is grown within eighty kilometers of our kitchen,\" she explains. This commitment initially raised costs, and several advisors urged her to switch to cheaper suppliers. Torres refused, believing that quality would eventually win customers over. Her instinct proved correct: last year, the bakery's revenue tripled, and its sourdough loaves won first prize at the National Artisan Bread Fair.\n\nThe company's newest location, opening next month in Westport, will include the firm's first baking school. Classes will be limited to twelve students to ensure hands-on instruction. Registration opens on the bakery's website this Friday, and proceeds from the classes will support a scholarship for culinary students.",
qs:[
{q:"What is suggested about Ms. Torres?",o:["She changed careers to start the bakery","She studied baking abroad","She inherited the business","She plans to retire soon"],a:0,tag:"定位",exp:"'founded by former accountant Mia Torres' → 她转行创业。推断题。"},
{q:"What did advisors suggest Ms. Torres do?",o:["Use less expensive suppliers","Open more locations","Raise her prices","Enter a baking competition"],a:0,tag:"定位",exp:"第二段 'urged her to switch to cheaper suppliers'。"},
{q:"The word \"instinct\" in paragraph 2 is closest in meaning to",o:["intuition","instruction","ambition","tradition"],a:0,tag:"词汇",exp:"同义替换题：instinct 直觉 ≈ intuition。"},
{q:"What is indicated about the baking school?",o:["Class size will be limited","It will be free of charge","It opens this Friday","It is located at the first store"],a:0,tag:"定位",exp:"'Classes will be limited to twelve students'。注意周五开放的是报名而非学校。"}
]}

{id:"lc-7",part:"P3",script:"M: Hi, I'm calling about the laptop I dropped off for repair last Tuesday. It's been a week and I haven't heard anything. W: Let me check... Yes, the screen replacement is done, but we're still waiting for a new battery to arrive. It should be here by Thursday. M: Hmm, I have a business trip on Friday morning. Is there any way to speed things up? W: In that case, I can install a compatible battery we have in stock. It's the same price, and you could pick up the laptop tomorrow afternoon.",

/* ================= 数据与工具 ================= */
const VOCAB = [].concat(window.VOCAB_S1,window.VOCAB_S2,window.VOCAB_S3||[],window.VOCAB_S4||[],window.VOCAB_G1,window.VOCAB_G2,window.VOCAB_G3||[],window.VOCAB_G4||[],window.VOCAB_B1,window.VOCAB_B2||[],window.VOCAB_B3||[])
  .map((v,i)=>Object.assign({id:"w"+i},v));
const KEY="toeicCoach.v1";
function fmtDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const todayStr=()=>fmtDate(new Date());
function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return fmtDate(d);}
let S=load();
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {srs:{},attempts:[],mocks:[],days:{},settings:{basePred:570}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function speak(text,rate){
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||0.95;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));
    if(vs.length)u.voice=vs.find(v=>/female|Samantha|Google US/i.test(v.name))||vs[0];
    speechSynthesis.speak(u);
  }catch(e){alert("当前浏览器不支持语音朗读");}
}
const REASONS=["词汇","语法","定位关键信息","做题太慢"];
const R_LABEL={"词汇":"词汇不认识","语法":"语法结构没看懂","定位关键信息":"定位关键信息不足","做题太慢":"做题太慢"};

/* ================= 统计 ================= */
function recentAttempts(days,type){
  const cutoff=addDays(todayStr(),-days);
  return S.attempts.filter(a=>a.date>=cutoff&&(!type||a.type===type));
}
function acc(list){if(!list.length)return null;return Math.round(100*list.filter(a=>a.correct).length/list.length);}
function avgTime(list){const t=list.filter(a=>a.time>0);if(!t.length)return null;return Math.round(t.reduce((s,a)=>s+a.time,0)/t.length);}
function reasonCounts(days){
  const c={};recentAttempts(days).filter(a=>!a.correct&&!a.mastered).forEach(a=>{(a.reasons||[]).forEach(r=>c[r]=(c[r]||0)+1);});
  return c;
}
function topWeakness(){
  const rc=reasonCounts(14);const rAcc=acc(recentAttempts(7,"reading"));const lAcc=acc(recentAttempts(7,"listening"));
  let best=null,n=0;for(const k in rc){if(rc[k]>n){n=rc[k];best=k;}}
  if(lAcc!==null&&rAcc!==null&&lAcc<rAcc-10)return{key:"听力",text:"听力正确率明显低于阅读，需要加强听力",detail:"近7天听力 "+lAcc+"% vs 阅读 "+rAcc+"%"};
  if(best&&n>=2)return{key:best,text:"反复出现的问题是"+R_LABEL[best],detail:"近14天因此错了 "+n+" 题"};
  if(rAcc!==null&&rAcc<70)return{key:"阅读",text:"阅读正确率低于70%，优先加强阅读",detail:"近7天阅读 "+rAcc+"%"};
  return{key:"阅读",text:"阅读表现需要优先加强",detail:"持续积累数据后分析会更准确"};
}
function predictScore(){
  const recent=S.mocks.slice(-3);
  if(recent.length){const av=Math.round(recent.reduce((s,m)=>s+m.l+m.r,0)/recent.length/5)*5;return{total:av,src:"近"+recent.length+"次模考平均"};}
  const rA=acc(recentAttempts(14,"reading")),lA=acc(recentAttempts(14,"listening"));
  if(rA===null&&lA===null)return{total:S.settings.basePred,src:"初始估计（做题后自动更新）"};
  const l=lA===null?S.settings.basePred/2:Math.round((200+lA*2.6)/5)*5;
  const r=rA===null?S.settings.basePred/2:Math.round((160+rA*2.6)/5)*5;
  return{total:Math.min(990,l+r),src:"根据近14天练习正确率估算"};
}

/* ================= 今日计划引擎 ================= */
const TASK_DEFS={
  vocabReview:{name:"复习旧词",icon:"📖",view:"vocab"},
  vocabNew:{name:"新短语",icon:"📝",view:"vocab"},
  reading:{name:"阅读主训练",icon:"🔍",view:"reading"},
  listening:{name:"听力维持",icon:"🎧",view:"listening"},
  review:{name:"错题复盘",icon:"📋",view:"review"}
};
function computePlan(){
  let plan={vocabReview:10,vocabNew:10,reading:25,listening:10,review:5};
  const rA=acc(recentAttempts(7,"reading")),lA=acc(recentAttempts(7,"listening"));
  const rT=avgTime(recentAttempts(7,"reading"));
  const notes=[];
  if(lA!==null&&rA!==null&&lA<rA-10){plan.reading-=7;plan.listening+=7;notes.push("听力成为短板，从阅读调 7 分钟给听力");}
  else if(rA!==null&&(rA<70||(rT&&rT>75))){plan.vocabNew-=3;plan.listening-=2;plan.reading+=5;notes.push(rA<70?"阅读正确率 "+rA+"% 低于目标，阅读时间 +5 分钟":"阅读平均用时偏长，阅读时间 +5 分钟");}
  const wrongs=S.attempts.filter(a=>!a.correct&&!a.mastered).length;
  if(wrongs>=8){plan.review+=3;plan.vocabNew-=3;notes.push("待复盘错题较多，复盘 +3 分钟");}
  return{plan,notes};
}
function getToday(){
  const d=todayStr();
  if(!S.days[d]){
    const{plan,notes}=computePlan();
    S.days[d]={plan,notes,done:{},swapped:{}};save();
  }
  return S.days[d];
}

function swapTask(k){
  const day=getToday();const w=topWeakness();
  const weakTask=w.key==="听力"?"listening":"reading";
  const options=Object.keys(TASK_DEFS).filter(x=>x!==k);
  const choice=prompt("把「"+TASK_DEFS[k].name+"」替换为（输入编号）：\n"+options.map((o,i)=>(i+1)+". "+TASK_DEFS[o].name).join("\n"));
  const idx=parseInt(choice)-1;
  if(isNaN(idx)||!options[idx])return;
  const to=options[idx];
  if(k===weakTask){
    if(!confirm("⚠️ 「"+TASK_DEFS[k].name+"」正是你当前的最优先弱项（"+w.text+"）。\n确定要替换掉它吗？"))return;
  }
  const min=day.plan[k];delete day.plan[k];delete day.done[k];
  day.plan[to]=(day.plan[to]||0)+min;day.swapped[to]=true;save();renderHome();
}

/* ================= 词汇模块 ================= */
const BOOKS={s:{name:"银之短语",need:null},g:{name:"金之短语",need:"s"},b:{name:"官方蓝皮书",need:"g"}};
const SRS_INT=[1,3,7,14,30];
let vState={book:"s",mode:null,queue:[],i:0,revealed:false,quizWrong:0,quizRight:0};
function srsOf(id){return S.srs[id]||null;}
function masteredCount(book){return VOCAB.filter(v=>v.b===book&&S.srs[v.id]&&S.srs[v.id].box>=2).length;}
function bookTotal(book){return VOCAB.filter(v=>v.b===book).length;}
function bookUnlocked(book){
  const need=BOOKS[book].need;if(!need)return true;
  return masteredCount(need)/bookTotal(need)>=0.6;
}
function dueWords(){const t=todayStr();return VOCAB.filter(v=>S.srs[v.id]&&S.srs[v.id].due<=t)
  .sort((a,b)=>(S.srs[b.id].w||0)-(S.srs[a.id].w||0));}
function wrongCount(id){return (S.srs[id]&&S.srs[id].w)||0;}
function isStubborn(id){return wrongCount(id)>=3;}
function stubbornWords(){return VOCAB.filter(v=>isStubborn(v.id)).sort((a,b)=>wrongCount(b.id)-wrongCount(a.id));}
function srsMark(v,ok){
  const r=S.srs[v.id]||{box:0,w:0,r:0};
  if(ok){r.r=(r.r||0)+1;r.box=Math.min((r.box||0)+1,SRS_INT.length-1);r.due=addDays(todayStr(),SRS_INT[r.box]);}
  else{r.w=(r.w||0)+1;r.box=0;r.due=addDays(todayStr(),1);}
  S.srs[v.id]=r;save();
}
function newWords(book,n){return VOCAB.filter(v=>v.b===book&&!S.srs[v.id]).slice(0,n);}

/* ================= 闪卡速刷 ================= */
let fState=null;
function startFlash(deck){
  if(!deck){
    const due=dueWords();
    const learned=VOCAB.filter(v=>S.srs[v.id]&&!due.includes(v));
    deck=due.length?due:learned.sort(()=>Math.random()-0.5);
    if(!deck.length)deck=VOCAB.filter(v=>v.b===vState.book).slice(0,15);
    const stub=stubbornWords().filter(v=>!deck.slice(0,20).includes(v));
    deck=stub.concat(deck).slice(0,20);
  }
  fState={deck,i:0,flipped:false,ok:0,ng:0};
  renderFlash();
}
function vStage(){return document.getElementById("gameStage")||document.getElementById("vocabStage");}
function vBack(){document.getElementById("gameStage")?renderGames():renderVocab();}
function renderFlash(){
  const st=vStage();
  if(!fState||fState.i>=fState.deck.length){
    st.innerHTML=`<div class="card" style="text-align:center"><h2>⚡ 闪卡完成</h2>
      <div class="stat-chips" style="justify-content:center">
        <div class="chip"><b>${fState?fState.ok:0}</b><span>认识</span></div>
        <div class="chip"><b>${fState?fState.ng:0}</b><span>不认识</span></div>
      </div>
      <p class="muted">不认识的词已重置到明天复习，错满 3 次会标记为顽固词</p>

function drawEbb(){
  const cv=document.getElementById("ebbChart");if(!cv)return;
  const ctx=cv.getContext("2d");const W=cv.width,H=cv.height,pad=34;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#e3ece6";ctx.beginPath();
  [0,50,100].forEach(p=>{const y=H-pad-(H-2*pad)*p/100;ctx.moveTo(pad,y);ctx.lineTo(W-10,y);});ctx.stroke();
  ctx.fillStyle="#6b7a70";ctx.font="11px sans-serif";
  [0,50,100].forEach(p=>{const y=H-pad-(H-2*pad)*p/100;ctx.fillText(p+"%",4,y+4);});
  const days=30,x0=pad,x1=W-14;
  const X=t=>x0+(x1-x0)*t/days;
  const Y=r=>H-pad-(H-2*pad)*r/100;
  function seg(t0,strength){
    ctx.beginPath();let first=true;
    for(let t=t0;t<=Math.min(days,t0+30);t+=0.25){
      const r=100*Math.exp(-(t-t0)/strength);
      if(r<12&&t>t0+1)break;
      first?ctx.moveTo(X(t),Y(r)):ctx.lineTo(X(t),Y(r));first=false;
    }
    ctx.stroke();
  }
  ctx.strokeStyle="#d97706";ctx.lineWidth=2;seg(0,3);
  ctx.strokeStyle="#1e7a3c";ctx.lineWidth=2;
  const marks=[1,3,7,14,30];let strength=3;
  marks.forEach((m,i)=>{strength=strength*2.2;seg(m,strength);});
  ctx.fillStyle="#1e7a3c";
  marks.forEach(m=>{ctx.beginPath();ctx.arc(X(m),Y(100),4,0,7);ctx.fill();
    ctx.fillText(m+"天",X(m)-8,Y(100)-8);});
  ctx.fillStyle="#d97706";ctx.fillText("不复习 → 快速遗忘",X(2),Y(30));
  ctx.fillStyle="#1e7a3c";ctx.fillText("每次复习后遗忘变慢",X(12),Y(80)+26);
  ctx.fillStyle="#6b7a70";ctx.fillText("天数 →",W-56,H-8);
}

function gamePool(n,needSentence){
  let pool=VOCAB.filter(v=>S.srs[v.id]);
  if(needSentence)pool=pool.filter(v=>{const c=v.e.split(/\s+/).length;return c>=6&&c<=12;});
  if(pool.length<n){
    let extra=VOCAB.filter(v=>!S.srs[v.id]&&(!needSentence||(v.e.split(/\s+/).length>=6&&v.e.split(/\s+/).length<=12)));
    pool=pool.concat(extra);
  }
  return pool.sort(()=>Math.random()-0.5).slice(0,n);
}

  const pool=gamePool(6);

  const st=document.getElementById("gameStage");
  const left=pool.slice().sort(()=>Math.random()-0.5);

  st.innerHTML=`<div class="card"><h3>🔗 连连看 · 英文短语 ↔ 中文释义</h3>

      <div>${right.map(v=>`<div class="mm-item" data-side="R" data-id="${v.id}" style="margin-bottom:8px">${esc(v.c)}</div>`).join("")}</div>
    </div><div id="mmDone"></div></div>`;
  st.querySelectorAll(".mm-item").forEach(it=>it.onclick=()=>mmPick(it));

function mmPick(it){
  if(it.classList.contains("done"))return;
  const sel=mState.sel;
  if(sel&&sel.dataset.side===it.dataset.side){sel.classList.remove("sel");mState.sel=it;it.classList.add("sel");return;}
  if(!sel){mState.sel=it;it.classList.add("sel");
    if(it.dataset.side==="L"){const v=VOCAB.find(x=>x.id===it.dataset.id);if(v)speak(v.p);}
    return;}
  if(sel.dataset.id===it.dataset.id){
    sel.classList.remove("sel");sel.classList.add("done");it.classList.add("done");
    mState.sel=null;mState.done++;
    if(mState.done>=mState.pool.length){
      const sec=Math.round((Date.now()-mState.t0)/1000);
      document.getElementById("mmDone").innerHTML=`<div class="callout" style="margin-top:12px">🎉 完成！用时 ${sec} 秒，失误 ${mState.errs} 次。<div style="margin-top:8px"><button class="btn small" onclick="startMatch()">再来一局</button></div></div>`;
    }
  }else{
    mState.errs++;document.getElementById("mmErr").textContent="失误 "+mState.errs;
    sel.classList.remove("sel");sel.classList.add("err");it.classList.add("err");
    const a=sel,b=it;mState.sel=null;
    setTimeout(()=>{a.classList.remove("err");b.classList.remove("err");},450);
  }
}

    <div class="muted" style="margin:6px 0">中文：${esc(v.t)}</div>
    <div class="seq-out" id="seqOut"></div>
    <div class="seq-pool" id="seqPool">${shuffled.map(o=>`<span class="seq-w" data-i="${o.i}">${esc(o.t)}</span>`).join("")}</div>
    <div id="seqFb"></div></div>`;
  document.querySelectorAll("#seqPool .seq-w").forEach(ch=>{
    ch.onclick=()=>{
      const expected=oState.cur.tokens[oState.cur.next];
      if(ch.textContent===expected){
        ch.classList.add("used");
        const out=document.getElementById("seqOut");
        const s=document.createElement("span");s.className="seq-w fixed";s.textContent=expected;out.appendChild(s);
        oState.cur.next++;
        if(oState.cur.next>=oState.cur.tokens.length){
          document.getElementById("seqFb").innerHTML=`<div class="callout">✅ ${esc(v.e)}<div class="t">${esc(transOf(v))}</div>
          <div style="margin-top:8px"><button class="btn small ghost" id="seqSay">🔊 听整句</button> <button class="btn small" id="seqNext">下一句</button></div></div>`;
          speak(v.e);
          document.getElementById("seqSay").onclick=()=>speak(v.e);
          document.getElementById("seqNext").onclick=()=>{oState.i++;renderOrder();};
        }
      }else{
        oState.errs++;ch.classList.add("err");setTimeout(()=>ch.classList.remove("err"),400);
      }
    };
  });
}

let qState=null;
function recordAttempt(o){
  S.attempts.push(Object.assign({date:todayStr(),mastered:false},o));save();
}
function answerUI(container,opts,onPick){
  container.innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("");
  container.querySelectorAll(".opt").forEach(b=>b.onclick=()=>onPick(parseInt(b.dataset.i),container));
}
function markOpts(container,picked,correct){
  container.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;
    if(i===correct)b.classList.add("correct");
    else if(i===picked)b.classList.add("wrong");
  });
}
function reasonPicker(id,timeSec,cb){
  const auto=timeSec>90?["做题太慢"]:[];
  const html=`<div class="callout warn" style="margin-top:10px;flex-direction:column">
    <b>这题错在哪？（可多选，帮助系统对症下药）</b>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      ${REASONS.map(r=>`<button class="btn small ${auto.includes(r)?"":"gray"}" data-r="${r}">${r}</button>`).join("")}
    </div>
    <div style="margin-top:8px"><button class="btn small" id="rDone-${id}">确定</button></div></div>`;
  const div=document.createElement("div");div.innerHTML=html;
  const sel=new Set(auto);
  div.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.r;
    if(sel.has(r)){sel.delete(r);b.classList.add("gray");}else{sel.add(r);b.classList.remove("gray");}
  });
  div.querySelector("#rDone-"+id).onclick=()=>{cb([...sel].length?[...sel]:["定位关键信息"]);};
  return div;
}

function drawTrend(days){
  const cv=document.getElementById("trendChart");if(!cv)return;
  const ctx=cv.getContext("2d");const W=cv.width,H=cv.height,pad=30;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#e3ece6";ctx.beginPath();
  [0,25,50,75,100].forEach(p=>{const y=H-pad-(H-2*pad)*p/100;ctx.moveTo(pad,y);ctx.lineTo(W-10,y);});
  ctx.stroke();
  ctx.fillStyle="#6b7a70";ctx.font="11px sans-serif";
  [0,50,100].forEach(p=>{const y=H-pad-(H-2*pad)*p/100;ctx.fillText(p+"%",2,y+4);});
  const step=(W-pad-20)/(days.length-1);
  function line(key,color){
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();let started=false;
    days.forEach((d,i)=>{if(d[key]===null)return;
      const x=pad+i*step,y=H-pad-(H-2*pad)*d[key]/100;
      if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
    ctx.stroke();
    days.forEach((d,i)=>{if(d[key]===null)return;
      const x=pad+i*step,y=H-pad-(H-2*pad)*d[key]/100;
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();});
  }
  line("r","#1e7a3c");line("l","#1d4ed8");
}
function stagnationReasons(){
  const out=[];
  const vDue=dueWords().length;
  const wrongVocab=reasonCounts(14)["词汇"]||0;
  if(vDue>15)out.push("词汇不稳：积压 "+vDue+" 个待复习词条，先清空复习队列。");
  if(wrongVocab>=3)out.push("词汇是错题主要来源（近14天 "+wrongVocab+" 题），生词在拖累阅读。");
  const rT=avgTime(recentAttempts(14,"reading"));
  if(rT&&rT>75)out.push("阅读速度慢：平均每题 "+rT+" 秒，Part 7 时间会不够。");
  const locErr=(reasonCounts(14)["定位关键信息"]||0);
  if(locErr>=3)out.push("Part 7 定位错误反复出现（近14天 "+locErr+" 题）。");
  return out;
}

  if(part==="P5")unit=tag==="词汇"?p.units.find(u=>u.t.includes("词汇")):null;
  if(part==="P7"&&tag==="词汇")unit=p.units.find(u=>u.t.includes("同义词"));
  const steps=(unit?unit.s:p.quick);
  return `<div class="callout" style="margin-top:8px;font-size:13px"><div>💡</div><div>${steps.map((s,i)=>(i+1)+". "+esc(s)).join("<br>")}<br><span class="muted">完整题型拆解见「解题思路」页</span></div></div>`;
}
function tipBlock(part,tag){
  return `<div style="margin:6px 0"><button class="btn small gray" onclick="const b=this.nextElementSibling;if(!b.innerHTML)b.innerHTML=tipHtml('${part}','${tag||""}');b.classList.toggle('hidden')">💡 解题思路</button><div class="hidden"></div></div>`;
}

function renderMock(){
  const el=document.getElementById("v-mock");
  const mocks=S.mocks;
  const last3=mocks.slice(-3);
  const avg3=last3.length===3?Math.round(last3.reduce((s,m)=>s+m.l+m.r,0)/3):null;
  const allAbove780=last3.length===3&&last3.every(m=>m.l+m.r>=780);
  const ready=avg3!==null&&avg3>=800&&allAbove780;
  el.innerHTML=`
  <div class="card"><h2>模考与报考判断</h2>
    <div class="callout" style="margin-bottom:12px"><div>📏</div><div>目标线：<b>听力 420 / 阅读 380 / 总分 800</b><br>
    <span class="muted">报考条件：连续 3 次完整模考平均 ≥ 800，且单次不低于 780</span></div></div>
    ${ready?`<div class="callout" style="background:#dcfce7;border-left-color:#16a34a"><div>🎉</div><div><b>恭喜！近 3 次模考平均 ${avg3} 分，全部 ≥780。可以考虑报名托业了！</b></div></div>`
      :last3.length===3?`<div class="callout warn"><div>⏳</div><div>近 3 次平均 ${avg3} 分${allAbove780?"":"，且有单次低于 780"}。还未达到报考条件，继续训练。</div></div>`
      :`<div class="muted" style="margin-bottom:10px">已记录 ${mocks.length} 次模考，需至少 3 次判断报考时机。</div>`}
  </div>
  <div class="card"><h3>记录一次完整模考</h3>
    <div class="formrow"><label>日期</label><input type="text" id="mkDate" value="${todayStr()}" style="width:130px">
      <label>听力</label><input type="number" id="mkL" style="width:90px" min="5" max="495" step="5">
      <label>阅读</label><input type="number" id="mkR" style="width:90px" min="5" max="495" step="5"></div>
    <div class="formrow"><label>各 Part 正确数（选填，格式 P1-P7 用逗号分隔，如 5,20,30,25,26,12,44）</label></div>
    <div class="formrow"><input type="text" id="mkParts" placeholder="6,25,39,30,30,16,54 满分参考" style="width:100%;max-width:420px"></div>
    <button class="btn" id="mkSave">保存模考</button>
  </div>
  <div class="card"><h3>模考历史</h3>
    ${mocks.length?`<table class="tbl"><tr><th>日期</th><th>听力</th><th>阅读</th><th>总分</th><th>达标</th><th></th></tr>
      ${mocks.slice().reverse().map((m,i)=>{
        const idx=mocks.length-1-i;const tot=m.l+m.r;
        return`<tr><td>${m.date}</td><td>${m.l}${m.l>=420?" ✅":""}</td><td>${m.r}${m.r>=380?" ✅":""}</td><td><b>${tot}</b></td>
        <td>${tot>=800?`<span class="pill g">≥800</span>`:tot>=780?`<span class="pill a">≥780</span>`:`<span class="pill r">未达标</span>`}</td>
        <td><button class="btn small gray" data-del="${idx}">删</button></td></tr>`;}).join("")}</table>`
    :`<p class="muted">暂无模考记录。建议每 1-2 周做一次完整计时模考（2 小时 200 题）。</p>`}
  </div>`;
  document.getElementById("mkSave").onclick=()=>{
    const l=+document.getElementById("mkL").value,r=+document.getElementById("mkR").value;
    const date=document.getElementById("mkDate").value||todayStr();
    if(!l||!r){alert("请填写听力和阅读分数");return;}
    const parts=document.getElementById("mkParts").value.split(",").map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
    S.mocks.push({date,l,r,parts});
    S.mocks.sort((a,b)=>a.date<b.date?-1:1);
    save();renderMock();
  };
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("删除这条模考记录？")){S.mocks.splice(parseInt(b.dataset.del),1);save();renderMock();}
  });
}

const SYNCKEY="toeicCoach.sync";
let SY={};try{SY=JSON.parse(localStorage.getItem(SYNCKEY))||{};}catch(e){}
function saveSY(){try{localStorage.setItem(SYNCKEY,JSON.stringify(SY));}catch(e){}}
function syncUrl(){
  if(!SY.db||!SY.code)return null;
  let u=SY.db.trim().replace(/\/+$/,"");
  if(!/^https:\/\//.test(u))return null;
  return u+"/toeic/"+encodeURIComponent(SY.code.trim())+".json";
}
function setSyncStatus(t){const e=document.getElementById("syncStatus");if(e)e.textContent=t;}
let pushTmr=null;
function schedulePush(){if(!syncUrl())return;clearTimeout(pushTmr);pushTmr=setTimeout(pushRemote,2500);}
async function pushRemote(){
  const u=syncUrl();if(!u)return;
  try{
    S.updatedAt=Date.now();
    const res=await fetch(u,{method:"PUT",body:JSON.stringify(S)});
    if(!res.ok)throw 0;
    SY.last=Date.now();saveSY();
    setSyncStatus("✅ 已同步 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){setSyncStatus("⚠️ 同步失败");}
}
function mergeState(r){
  if(!r||typeof r!=="object")return;
  if(r.srs)Object.keys(r.srs).forEach(id=>{
    const a=S.srs[id],b=r.srs[id];
    if(!a||b.box>a.box||(b.box===a.box&&b.due>a.due))S.srs[id]=b;
  });
  const sig=a=>[a.qid,a.date,a.time,a.correct,a.type].join("|");
  if(Array.isArray(r.attempts)){
    const have=new Set(S.attempts.map(sig));
    r.attempts.forEach(a=>{if(!have.has(sig(a)))S.attempts.push(a);});
    const rm={};r.attempts.forEach(a=>{if(a.mastered)rm[sig(a)]=1;});
    S.attempts.forEach(a=>{if(rm[sig(a)])a.mastered=true;});
    S.attempts.sort((x,y)=>x.date<y.date?-1:1);
  }
  if(Array.isArray(r.mocks)){
    const ms=m=>[m.date,m.l,m.r].join("|");
    const have=new Set(S.mocks.map(ms));
    r.mocks.forEach(m=>{if(!have.has(ms(m)))S.mocks.push(m);});
    S.mocks.sort((a,b)=>a.date<b.date?-1:1);
  }
  if(r.days)Object.keys(r.days).forEach(d=>{
    const a=S.days[d],b=r.days[d];
    if(!a){S.days[d]=b;return;}
    if(b.done)Object.keys(b.done).forEach(k=>{if(b.done[k])a.done[k]=true;});
  });
  if(r.settings)S.settings=Object.assign({},r.settings,S.settings);
}
async function pullAndMerge(){
  const u=syncUrl();if(!u)return false;
  try{
    setSyncStatus("⏳ 同步中…");
    const res=await fetch(u);
    if(!res.ok)throw 0;
    const remote=await res.json();
    if(remote)mergeState(remote);
    save0();
    await pushRemote();
    return true;
  }catch(e){setSyncStatus("⚠️ 同步失败");return false;}
}
const save0=save;
save=function(){save0();schedulePush();};

};

/* ================= 音标标注与翻译 ================= */
function ipaRuby(text){
  return String(text).split(/(\s+)/).map(tok=>{
    if(!tok||/^\s+$/.test(tok))return tok;
    const m=tok.match(/^([A-Za-z][A-Za-z']*)([\s\S]*)$/);
    if(!m)return esc(tok);
    const w=m[1],rest=m[2]||"";
    const ipa=window.IPA&&window.IPA[w.toLowerCase()];
    if(!ipa)return esc(tok);
    const weak=window.FUNCW&&window.FUNCW.has(w.toLowerCase());
    return `<ruby class="${weak?"rwk":"rst"}">${esc(w)}<rt>${esc(ipa)}</rt></ruby>${esc(rest)}`;
  }).join("");
}
function transOf(v){
  const lang=S.settings.transLang||"ja";
  if(lang==="ja")return (window.JA&&window.JA[v.p])||v.t;
  return v.t;
}
